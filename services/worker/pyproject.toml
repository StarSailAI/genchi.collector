[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "allfeeds-worker"
version = "0.1.0"
description = "Plugin worker for the AllFeeds distributed collection framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "allfeeds-contracts>=0.1.0",
  "allfeeds-sdk>=0.1.0",
  "boto3>=1.35",
  "psutil>=6.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[project.scripts]
allfeeds-worker = "allfeeds_worker.main:main"
allfeeds-plugin = "allfeeds_worker.plugins_cli:main"

[project.entry-points."allfeeds.sinks"]
postgres = "allfeeds_worker.sink:PostgresSink"

[project.entry-points."allfeeds.asset_stores"]
local = "allfeeds_worker.assets:LocalAssetStore"
s3 = "allfeeds_worker.assets:S3AssetStore"

[tool.setuptools.packages.find]
where = ["src"]
