<!doctype html>
<html lang="$locale">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>$subject</title>
  </head>
  <body style="margin:0;padding:0;width:100%;background-color:#f7f7fb;color:#252535;-webkit-text-size-adjust:100%;">
    <div style="display:none;font-size:1px;line-height:1px;color:#f7f7fb;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">$preheader</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7f7fb" style="width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;">
      <tr>
        <td align="center" style="padding:36px 16px 28px;">
          <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;border:1px solid #e6e7ef;border-top:4px solid #e83e60;border-radius:18px;border-spacing:0;background-color:#ffffff;">
            <tr>
              <td style="padding:27px 28px 22px;border-bottom:1px solid #eeeef4;">
                <a href="$site_url" style="display:inline-block;color:#252535;font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:400;line-height:1.2;letter-spacing:-1px;text-decoration:none;">genchi<span style="color:#e83e60;">.news</span></a>
                <p lang="ja" style="margin:7px 0 0;color:#70717f;font-family:'Songti SC','Hiragino Mincho ProN','Yu Mincho',serif;font-size:12px;line-height:1.5;letter-spacing:3px;">現地情報</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 28px 32px;">
                <p style="margin:0 0 10px;color:#e83e60;font-size:12px;font-weight:700;line-height:1.5;letter-spacing:1px;">$eyebrow</p>
                <h1 style="margin:0;color:#252535;font-size:24px;font-weight:700;line-height:1.5;">$heading</h1>
                $intro_block
                $items_block
                $facts_block
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:26px;border-collapse:collapse;">
                  <tr>
                    <td align="center" bgcolor="#d32650" style="border-radius:10px;background-color:#d32650;">
                      <a href="$cta_url" style="display:block;padding:15px 18px;color:#ffffff;font-size:14px;font-weight:700;line-height:1.4;text-decoration:none;">$cta_label&nbsp; →</a>
                    </td>
                  </tr>
                </table>
                $official_block
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px;border-top:1px solid #eeeef4;color:#858593;font-size:11px;line-height:1.9;">
                <a href="$dashboard_url" style="color:#5d6070;text-decoration:underline;">$manage_label</a>
                <span style="padding:0 8px;color:#c5c6cf;">·</span>
                <a href="$unsubscribe_url" style="color:#5d6070;text-decoration:underline;">$unsubscribe_label</a>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
          <p style="margin:26px 0 8px;color:#252535;font-size:18px;font-weight:600;line-height:1.6;">$tagline1<span style="color:#e83e60;">$tagline2</span></p>
        </td>
      </tr>
    </table>
  </body>
</html>
