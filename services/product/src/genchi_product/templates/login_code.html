<!doctype html>
<html lang="$locale">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>$subject</title>
  </head>
  <body style="margin:0;padding:0;width:100%;background-color:#f7f7fb;color:#252535;-webkit-text-size-adjust:100%;">
    <div style="display:none;font-size:1px;line-height:1px;color:#f7f7fb;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
      $preheader
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7f7fb" style="width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;">
      <tr>
        <td align="center" style="padding:36px 16px 28px;">
          <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;border:1px solid #e6e7ef;border-top:4px solid #e83e60;border-radius:18px;border-spacing:0;background-color:#ffffff;">
            <tr>
              <td style="padding:30px 28px 24px;border-bottom:1px solid #eeeef4;">
                <a href="$site_url" style="display:inline-block;color:#252535;font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-1px;text-decoration:none;">genchi<span style="color:#e83e60;">.news</span></a>
                <p lang="ja" style="margin:7px 0 0;color:#70717f;font-family:'Songti SC','Hiragino Mincho ProN','Yu Mincho',serif;font-size:12px;line-height:1.5;letter-spacing:3px;">現地情報</p>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 28px 32px;">
                <h1 style="margin:0 0 14px;color:#252535;font-size:24px;font-weight:700;line-height:1.5;">$heading</h1>
                <p style="margin:0 0 24px;color:#70717f;font-size:14px;line-height:1.9;">$instructions1<br />$instructions2</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff0f3" style="width:100%;border:1px solid #f5d7de;border-radius:12px;background-color:#fff0f3;">
                  <tr>
                    <td align="center" style="padding:22px 8px 12px;color:#cb2850;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:34px;font-weight:600;line-height:1.4;letter-spacing:7px;white-space:nowrap;">$code</td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 12px 20px;color:#70717f;font-size:12px;line-height:1.8;">$expiry</td>
                  </tr>
                </table>
                <p style="margin:22px 0 0;color:#70717f;font-size:13px;line-height:1.9;">$signup</p>
                <p style="margin:18px 0 0;padding-top:18px;border-top:1px solid #eeeef4;color:#858593;font-size:12px;line-height:1.9;">$security1<br />$security2</p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
          <p style="margin:26px 0 8px;color:#252535;font-size:18px;font-weight:600;line-height:1.6;">$tagline1<span style="color:#e83e60;">$tagline2</span></p>
          <p style="margin:0;color:#858593;font-size:11px;line-height:1.8;">$footnote</p>
        </td>
      </tr>
    </table>
  </body>
</html>
