[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "allfeeds-sdk"
version = "0.1.0"
description = "Plugin SDK for AllFeeds fetchers, sinks and asset stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["allfeeds-contracts>=0.1.0", "pydantic>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]
