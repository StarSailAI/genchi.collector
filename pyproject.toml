[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genchi-collector-oss"
version = "0.1.0"
description = "A small, self-hosted source collection core extracted from Genchi Collector"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "ruff>=0.5"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/contracts/src",
  "packages/sdk/src",
  "services/controller/src",
  "services/worker/src",
  "plugins/builtin/src",
  "examples/custom-fetcher/src",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
