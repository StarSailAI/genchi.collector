[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "allfeeds"
version = "0.1.0"
description = "A distributed tool for crawling and collecting data from many kinds of sources"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/contracts/src",
  "packages/sdk/src",
  "services/controller/src",
  "services/worker/src",
  "plugins/builtin/src",
  "plugins/genchi/src",
  "services/normalizer/src",
  "services/product/src",
  "dashboard/src",
  "examples/custom-fetcher/src",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-target-version]
"deploy/*.py" = "py310"
