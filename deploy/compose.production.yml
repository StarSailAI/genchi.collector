# Layer over ../docker-compose.yml; use deploy/manage.py to supply the shared env.
services:
  postgres:
    mem_limit: 768m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=64"]
  control:
    image: genchi/control:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 384m
    volumes:
      - ${GENCHI_ROOT}/.deploy/sources.yaml:/app/config/sources.yaml:ro
  worker:
    image: genchi/worker:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 512m
  cloakbrowser:
    mem_limit: 1400m
    environment:
      CLOAKBROWSER_X_COOKIES_PATH: /run/genchi-secrets/x-cookies.json
    volumes:
      - ${GENCHI_ROOT}/secrets:/run/genchi-secrets:ro
  normalizer:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 384m
    command: ["sh", "-c", "genchi-normalizer migrate && exec genchi-product worker --mode ${CATALOG_WORKER_MODE:-idle}"]
  product:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 256m
  notifier:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 192m
  mailpit:
    mem_limit: 96m
  dashboard:
    profiles: ["operations"]
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [genchi-data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
