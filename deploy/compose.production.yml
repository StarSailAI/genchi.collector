# Layer over ../docker-compose.yml; use deploy/manage.py to supply the shared env.
services:
  postgres:
    mem_limit: 768m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=64"]
  control:
    image: genchi/control:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 384m
    environment:
      ALLFEEDS_SOURCES: /app/runtime/sources.yaml
    volumes:
      # Keep the generated file outside the repository config bind mount.
      # Replacing a tracked file during deployment must not shadow this mount.
      - ${GENCHI_ROOT}/.deploy/sources.yaml:/app/runtime/sources.yaml:ro
  worker:
    image: genchi/worker:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 512m
  verification-agent:
    mem_limit: 128m
  browser:
    mem_limit: 1400m
    environment:
      BROWSER_X_AUTH_MODE: ${X_AUTH_MODE:-anonymous}
      BROWSER_X_COOKIES_PATH: /run/genchi-secrets/x-cookies.json
    volumes:
      - ${GENCHI_ROOT}/secrets/x-cookies.json:/run/genchi-secrets/x-cookies.json:ro
  normalizer:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 384m
    command: ["sh", "-c", "genchi-normalizer migrate && exec genchi-product worker --mode ${CATALOG_WORKER_MODE:-idle}"]
  reviewer:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 384m
  product:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 256m
  notifier:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    # Attachment encoding and a durable retry payload can briefly consume extra memory.
    mem_limit: 512m
    command: ["genchi-product", "worker", "--mode", "${NOTIFIER_WORKER_MODE:-idle}"]
  collection-digest:
    image: genchi/product:${GENCHI_IMAGE_TAG:-current}
    mem_limit: 192m
  mailpit:
    mem_limit: 96m
  dashboard:
    profiles: ["operations"]
