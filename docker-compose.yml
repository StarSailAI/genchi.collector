name: genchi-collector

x-database: &database
  DATABASE_URL: postgresql://genchi:${POSTGRES_PASSWORD:-genchi-local}@postgres:5432/genchi
  ALLFEEDS_DB_SCHEMA: allfeeds

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genchi
      POSTGRES_USER: genchi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genchi-local}
      GENCHI_READER_PASSWORD: ${GENCHI_READER_PASSWORD:-genchi-reader-local}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-reader.sh:/docker-entrypoint-initdb.d/10-init-reader.sh:ro
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    networks: [collector, genchi-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genchi -d genchi"]
      interval: 5s
      timeout: 3s
      retries: 20

  control:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        allfeeds-control migrate &&
        allfeeds-control enrollment-bootstrap --token "$${ENROLLMENT_TOKEN}" --max-uses 100000 &&
        exec allfeeds-control serve --host 0.0.0.0 --port 8060
    environment:
      <<: *database
      ALLFEEDS_SOURCES: /app/config/sources.yaml
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-genchi-local-control-token}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-genchi-local-enrollment-token}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-32}
      REGISTRAR_TICK_SECONDS: ${REGISTRAR_TICK_SECONDS:-10}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${CONTROL_BIND_HOST:-127.0.0.1}:${CONTROL_PORT:-8060}:8060"
    networks: [collector]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  browser:
    build:
      context: .
      dockerfile: services/browser/Dockerfile
    image: genchi/browser:${GENCHI_IMAGE_TAG:-current}
    restart: unless-stopped
    init: true
    shm_size: ${BROWSER_SHM_SIZE:-512m}
    environment:
      BROWSER_API_TOKEN: ${BROWSER_API_TOKEN:-genchi-local-browser-token}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-1}
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-1}
      BROWSER_LOCALE: ${BROWSER_LOCALE:-ja-JP}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [collector]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  verification-agent:
    image: genchi/browser:${GENCHI_IMAGE_TAG:-current}
    command: ["python", "/app/verification_agent.py"]
    restart: unless-stopped
    init: true
    depends_on:
      browser:
        condition: service_healthy
    environment:
      BROWSER_URL: http://browser:3003
      BROWSER_API_TOKEN: ${BROWSER_API_TOKEN:-genchi-local-browser-token}
      VERIFICATION_AGENT_ENABLED: ${VERIFICATION_AGENT_ENABLED:-false}
      VERIFICATION_LLM_BASE_URL: ${VERIFICATION_LLM_BASE_URL:-}
      VERIFICATION_LLM_API_KEY: ${VERIFICATION_LLM_API_KEY:-}
      VERIFICATION_LLM_MODEL: ${VERIFICATION_LLM_MODEL:-}
      VERIFICATION_DAILY_MODEL_CALLS: ${VERIFICATION_DAILY_MODEL_CALLS:-40}
    volumes:
      - verification-state:/home/browser/verification-agent
    networks: [collector]
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
      browser:
        condition: service_healthy
    environment:
      <<: *database
      CONTROL_URL: http://control:8060
      CONTROL_TLS_VERIFY: "0"
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-genchi-local-enrollment-token}
      ALLFEEDS_NODE_ID: ${ALLFEEDS_NODE_ID:-genchi-resident-01}
      ALLFEEDS_WORKER_CONCURRENCY: ${ALLFEEDS_WORKER_CONCURRENCY:-4}
      WORKER_STATE_PATH: /var/lib/allfeeds-worker/identity.json
      ASSET_STORE_PATH: /data/assets
      BROWSER_URL: http://browser:3003
      BROWSER_API_TOKEN: ${BROWSER_API_TOKEN:-genchi-local-browser-token}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - worker-state:/var/lib/allfeeds-worker
      - asset-data:/data/assets
    networks: [collector]

  normalizer:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    command: ["sh", "-c", "genchi-normalizer migrate && exec genchi-product worker --mode catalog"]
    environment:
      <<: *database
      GENCHI_DB_SCHEMA: genchi
      NORMALIZER_POLL_SECONDS: ${NORMALIZER_POLL_SECONDS:-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [collector]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  product:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    command: ["genchi-product", "serve"]
    restart: unless-stopped
    depends_on:
      normalizer:
        condition: service_healthy
    environment:
      <<: *database
      PRODUCT_SECRET: ${PRODUCT_SECRET:?Set PRODUCT_SECRET in .env}
      PRODUCT_ADMIN_TOKEN: ${PRODUCT_ADMIN_TOKEN:?Set PRODUCT_ADMIN_TOKEN in .env}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:13000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@genchi.local}
      PRODUCT_PROXY_SECRET: ${PRODUCT_PROXY_SECRET:?Set the same PRODUCT_PROXY_SECRET as genchi.news}
      AUTH_REGISTRATION_OPEN: ${AUTH_REGISTRATION_OPEN:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Genchi <hello@genchi.local>}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:${PRODUCT_PORT:-18080}:8080"]
    networks: [collector, genchi-data]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; result=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)); assert result.get('auth_method') == 'email_code'"]
      interval: 10s
      timeout: 5s
      retries: 6

  notifier:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    command: ["genchi-product", "worker", "--mode", "notifications"]
    restart: unless-stopped
    depends_on:
      product:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *database
      PRODUCT_SECRET: ${PRODUCT_SECRET:?Set PRODUCT_SECRET in .env}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:13000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Genchi <hello@genchi.local>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@genchi.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    networks: [collector]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6

  collection-digest:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    command: ["genchi-product", "worker", "--mode", "${COLLECTION_DIGEST_WORKER_MODE:-idle}"]
    restart: unless-stopped
    depends_on:
      product:
        condition: service_healthy
    environment:
      <<: *database
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@genchi.local}
      MAIL_FROM: ${MAIL_FROM:-Genchi <hello@genchi.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      COLLECTION_DIGEST_TIMEZONE: ${COLLECTION_DIGEST_TIMEZONE:-Asia/Tokyo}
      COLLECTION_DIGEST_NOT_BEFORE: ${COLLECTION_DIGEST_NOT_BEFORE:-18:00}
      COLLECTION_DIGEST_FORCE_AT: ${COLLECTION_DIGEST_FORCE_AT:-23:00}
    networks: [collector]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-18025}:8025"]
    networks: [collector]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    environment:
      CONTROL_URL: http://control:8060
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-genchi-local-control-token}
      CONTROL_TLS_VERIFY: "0"
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-8050}:8050"
    networks: [collector]

volumes:
  verification-state:
  postgres-data:
  worker-state:
  asset-data:

networks:
  collector:
  genchi-data:
    name: genchi-data
