      link_pattern: '^https://www\.bluenoteplace\.jp/(ensemble_stars_2026/|live/ensemble-stars-260913/)$'
      title_selector: .newsDetailTitle, .eventRequiredBody
      content_selector: .newsDetailBody, .eventDetail
