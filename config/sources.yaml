  - id: blue-note-place-ensemble-band-live
    enabled: true
    fetcher: genchi.official_site
    sink: postgres
    schedule: {type: cron, cron: "30 3 * * *", timezone: Asia/Tokyo}
    config:
      start_urls:
        - https://www.bluenoteplace.jp/ensemble_stars_2026/
