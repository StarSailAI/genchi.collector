version: 1

# V1 intentionally covers official websites and official X accounts only.
# Additional projects are present in config/catalog.yaml and are enabled in
# manually approved waves.
sources:
  - id: bang-dream-news
    enabled: true
    fetcher: genchi.official_site
    sink: postgres
    schedule: {type: interval, seconds: 900, timezone: Asia/Tokyo}
    config:
      start_urls: [https://bang-dream.com/news/]
      link_pattern: '^https://bang-dream\.com/(news/[0-9]+/|events/[^/]+/)$'
      list_item_selector: .p-news-list__item
      detail_link_selector: a.p-news-list__item-link
      title_selector: h1, .p-article__title, .p-news-detail__title
      content_selector: article, main, .p-news-detail
      published_selector: time, .p-news-detail__date
      max_pages: 2
      backfill_max_pages: 20
      max_items: 80
    retry: {max_attempts: 4, backoff: exponential, base_seconds: 30, max_seconds: 1800}
    routing:
      queue: web
      resources: {domain:bang-dream.com: 2}
    tags: [project:bang-dream, country:JP, timezone:Asia/Tokyo, source:official-site]
    backfill_enabled: true
    backfill_window_seconds: 2678400

  - id: girls-band-cry-news
    enabled: true
    fetcher: genchi.official_site
    sink: postgres
    schedule: {type: interval, seconds: 900, timezone: Asia/Tokyo}
    config:
      start_urls: [https://girls-band-cry.com/news/]
      link_pattern: '^https://girls-band-cry\.com/news/post-[0-9]+\.html$'
      list_item_selector: .news-List .item
      detail_link_selector: a[href]
      next_selector: a.next, .wp-pagenavi a.nextpostslink
      title_selector: h1, .sw-Ttl, .news-Detail_Ttl
      content_selector: article, main, .news-Detail, .sw-Frame
      published_selector: time, .time
      max_pages: 2
      backfill_max_pages: 30
      max_items: 100
    retry: {max_attempts: 4, backoff: exponential, base_seconds: 30, max_seconds: 1800}
    routing:
      queue: web
      resources: {domain:girls-band-cry.com: 2}
    tags: [project:girls-band-cry, country:JP, timezone:Asia/Tokyo, source:official-site]
    backfill_enabled: true
    backfill_window_seconds: 2678400

  - id: love-live-news
    enabled: true
    fetcher: genchi.official_site
    sink: postgres
    schedule: {type: interval, seconds: 900, timezone: Asia/Tokyo}
    config:
      start_urls: [https://www.lovelive-anime.jp/news/]
      link_pattern: '^https://www\.lovelive-anime\.jp/news/[^?#]+$'
      detail_link_selector: a[href*="/news/"]
      title_selector: h1, .p-article__title
      content_selector: article, .p-article__content, main
      published_selector: time, .p-article__date
      browser: true
      wait_selector: body
      max_pages: 1
      backfill_max_pages: 20
      max_items: 80
    timeout_seconds: 1200
    retry: {max_attempts: 4, backoff: exponential, base_seconds: 60, max_seconds: 3600}
    routing:
      queue: browser
      capabilities: [browser_api]
      resources: {browser_api: 2, domain:lovelive-anime.jp: 1}
    tags: [project:love-live, country:JP, timezone:Asia/Tokyo, source:official-site]
    backfill_enabled: true
    backfill_window_seconds: 2678400

  - id: idolmaster-news
